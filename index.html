<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>

* {
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    box-sizing: border-box;
}
body {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
    overflow: hidden;
    touch-action: none;
    margin: 0;
    padding: 0;
}
.pixel-font {
    font-family: 'Press Start 2P', monospace;
}

/* 冰块玻璃拟态主体 */
.ice-shell {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.28) 100%);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 2px solid rgba(255, 255, 255, 0.9);
    border-left: 2px solid rgba(255, 255, 255, 0.8);
    border-right: 2px solid rgba(255, 255, 255, 0.3);
    border-bottom: 4px solid rgba(186, 230, 253, 0.6);
    box-shadow: 
        0 30px 60px -12px rgba(14, 116, 144, 0.25),
        inset 0 2px 6px rgba(255, 255, 255, 0.9),
        inset 0 -8px 16px rgba(186, 230, 253, 0.5),
        inset 0 0 40px rgba(224, 242, 254, 0.4);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* 内部电路板隐约可见的效果 */
.circuit-pattern {
    background-image: radial-gradient(rgba(14, 165, 233, 0.1) 2px, transparent 2px),
                      linear-gradient(90deg, rgba(14, 165, 233, 0.05) 1px, transparent 1px),
                      linear-gradient(rgba(14, 165, 233, 0.05) 1px, transparent 1px);
    background-size: 20px 20px, 10px 10px, 10px 10px;
}

/* 屏幕外框 */
.screen-bezel {
    background: rgba(255, 255, 255, 0.45);
    box-shadow: 
        inset 0 3px 6px rgba(14, 116, 144, 0.15),
        0 2px 4px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.65);
}

/* 游戏屏幕 */
.game-screen {
    background: #0f172a;
    box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.85);
}

/* 冰块十字键 */
.d-pad-container {
    filter: drop-shadow(0 6px 8px rgba(14, 116, 144, 0.2));
}
.ice-dpad {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: inset 0 2px 4px rgba(255,255,255,1), inset 0 -2px 4px rgba(186, 230, 253, 0.8);
    transition: all 0.06s ease;
}
.ice-dpad:active, .ice-dpad.active {
    background: rgba(186, 230, 253, 0.95);
    transform: scale(0.93);
    box-shadow: inset 0 2px 6px rgba(14, 116, 144, 0.35);
}

/* 跟手摇杆样式 */
.joystick-base {
    background: radial-gradient(circle, rgba(224,242,254,0.6) 0%, rgba(255,255,255,0.85) 100%);
    border: 2px solid rgba(255, 255, 255, 0.95);
    box-shadow: 
        inset 0 4px 10px rgba(14, 116, 144, 0.2),
        0 6px 12px rgba(14, 116, 144, 0.15);
}
.joystick-stick {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(186, 230, 253, 0.85));
    border: 2px solid rgba(255, 255, 255, 1);
    box-shadow: 
        0 6px 12px rgba(14, 116, 144, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 1);
    transition: transform 0.05s linear;
}
.joystick-stick.returning {
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* 糖果色果冻AB键 */
.btn-jelly-pink {
    background: linear-gradient(145deg, rgba(251, 113, 133, 0.88), rgba(225, 29, 72, 0.78));
    box-shadow: 
        0 6px 0 rgba(190, 18, 60, 0.6),
        0 8px 12px rgba(225, 29, 72, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 228, 230, 0.6);
    backdrop-filter: blur(4px);
    transition: all 0.06s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-jelly-pink:active, .btn-jelly-pink.active {
    transform: translateY(5px);
    box-shadow: 
        0 1px 0 rgba(190, 18, 60, 0.6),
        0 2px 4px rgba(225, 29, 72, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.6);
}

.btn-jelly-cyan {
    background: linear-gradient(145deg, rgba(56, 189, 248, 0.88), rgba(2, 132, 199, 0.78));
    box-shadow: 
        0 6px 0 rgba(3, 105, 161, 0.6),
        0 8px 12px rgba(2, 132, 199, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(224, 242, 254, 0.6);
    backdrop-filter: blur(4px);
    transition: all 0.06s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-jelly-cyan:active, .btn-jelly-cyan.active {
    transform: translateY(5px);
    box-shadow: 
        0 1px 0 rgba(3, 105, 161, 0.6),
        0 2px 4px rgba(2, 132, 199, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.6);
}

/* 功能小胶囊键 */
.pill-btn {
    background: rgba(255, 255, 255, 0.65);
    box-shadow: 0 3px 0 rgba(148, 163, 184, 0.5), 0 4px 6px rgba(0,0,0,0.05), inset 0 1px 2px white;
    border: 1px solid rgba(255,255,255,0.85);
    transition: all 0.08s;
}
.pill-btn:active, .pill-btn.active {
    transform: translateY(3px);
    box-shadow: 0 0px 0 rgba(148, 163, 184, 0.5), inset 0 1px 2px rgba(0,0,0,0.1);
}

/* 顶部快捷悬浮栏按钮 */
.top-pill {
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 4px 12px rgba(14, 116, 144, 0.12), inset 0 1px 2px rgba(255, 255, 255, 0.9);
    transition: all 0.2s ease;
}
.top-pill:hover {
    background: rgba(255, 255, 255, 0.75);
}
.top-pill:active {
    transform: scale(0.95);
}

/* 人体工学抓握模式样式调整 */
.ice-shell.ergo-mode {
    border-radius: 44px;
}
.ice-shell.ergo-mode .controls-area {
    padding-left: 2px;
    padding-right: 2px;
    transform: translateY(-6px);
}

/* 装饰背景气泡 */
.bg-bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
    box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
    backdrop-filter: blur(2px);
    z-index: 0;
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
}
@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
}

/* 扫描线效果 */
.scanlines {
    background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.15) 50%,
        rgba(0, 0, 0, 0.15)
    );
    background-size: 100% 4px;
}

</style></head><body>

<script>

/**
 * 1. 音效合成器 (Web Audio API 8-bit 冰晶音效)
 */
class SoundFX {
    constructor() {
        this.ctx = null;
        this.muted = false;
    }
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
    toggleMute() {
        this.muted = !this.muted;
        updateLedIndicator();
        if (!this.muted) this.playCoin();
    }
    playJump() {
        if (this.muted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
    }
    playDash() {
        if (this.muted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }
    playLaser() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.08);
    }
    playBounce() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(587.33, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.06);
    }
    playCoin() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.07);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.32);
    }
    playCheat() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.065);
            gain.gain.setValueAtTime(0.16, now + idx * 0.065);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.065);
            osc.stop(now + idx * 0.065 + 0.22);
        });
    }
    playSwitch() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.06);
        osc.frequency.setValueAtTime(783.99, now + 0.12);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.25);
    }
    playDead() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.4);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.4);
    }
}

/* ================= 冰晶商店系统 (ICE SHOP: 皮肤与道具兑换) ================= */
function updateShopScreen() {
    frameCount++;
    const itemsInTab = SHOP_CATALOG.filter(it => (shopTab === 0 ? it.type === 'skin' : it.type === 'item'));

    if (justPressed.LEFT || justPressed.RIGHT) {
        shopTab = shopTab === 0 ? 1 : 0;
        shopCursor = 0;
        sfx.playBounce();
    }
    if (justPressed.DOWN) {
        shopCursor = (shopCursor + 1) % itemsInTab.length;
        sfx.playBounce();
    }
    if (justPressed.UP) {
        shopCursor = (shopCursor - 1 + itemsInTab.length) % itemsInTab.length;
        sfx.playBounce();
    }

    // B 键返回桌面
    if (justPressed.B) {
        openHomeDesktop();
        return;
    }

    // A 键购买/穿戴/切换道具开关
    if (justPressed.A) {
        const entry = itemsInTab[shopCursor];
        if (!entry) return;

        if (entry.type === 'skin') {
            const owned = shopData.ownedSkins.includes(entry.id);
            if (owned) {
                shopData.activeSkin = entry.id;
                saveShopData();
                sfx.playCoin();
                showToast(`已装备: ${entry.name}`);
            } else if (shopData.coins >= entry.price) {
                shopData.coins -= entry.price;
                shopData.ownedSkins.push(entry.id);
                shopData.activeSkin = entry.id;
                saveShopData();
                sfx.playCheat();
                showToast(`解锁成功: ${entry.name}!`);
            } else {
                sfx.playDead();
                showToast('星尘不足! 快去玩游戏收集吧');
            }
        } else {
            // 购买道具
            if (shopData.coins >= entry.price) {
                shopData.coins -= entry.price;
                shopData.items[entry.id] = (shopData.items[entry.id] || 0) + 1;
                shopData.useItems[entry.id] = true;
                saveShopData();
                sfx.playCoin();
                showToast(`已兑换 ${entry.name} x1`);
            } else {
                sfx.playDead();
                showToast('星尘不足! 无法兑换该道具');
            }
        }
    }

    // START 键在道具页可切换道具是否携带出战
    if (justPressed.START && shopTab === 1) {
        const entry = itemsInTab[shopCursor];
        if (entry) {
            shopData.useItems[entry.id] = !shopData.useItems[entry.id];
            saveShopData();
            sfx.playBounce();
        }
    }
}

    ctx.font = '6px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(shopTab === 0 ? '[◀▶]TAB  [A]BUY/EQUIP  [B]HOME' : '[A]BUY  [START]ON/OFF  [B]HOME', GW / 2, GH - 7);
}

/* ================= 游戏 0: FROSTY CLIMB (冰晶攀登 + AI托管 + 皮肤道具) ================= */
let cameraY = 0;
let player;
let platforms = [];
let stars = [];

class ClimbPlayer {
    constructor() {
        this.w = 14;
        this.h = 14;
        this.x = GW / 2 - this.w / 2;
        this.y = GH - 40;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
        this.dashCool = 0;
        this.dashTime = 0;
        this.facing = 1;
        this.scaleX = 1;
        this.scaleY = 1;
    }

    update() {
        const accel = this.grounded ? 0.55 : 0.35;
        const maxSpeed = 2.75;
        let aiMoveX = 0;
        let aiJump = false;
        let aiDash = false;

        // 秘籍 AI 自动操作逻辑：智能寻找上方最近平台与星星
        if (autoPlay) {
            let targetPlat = null;
            let bestScore = Infinity;
            for (let p of platforms) {
                if (p.broken) continue;
                const dy = (this.y + this.h) - p.y;
                // 优先寻找角色上方可跳跃高度内的平台
                if (dy >= -8 && dy < 78) {
                    const dist = Math.abs((p.x + p.w / 2) - (this.x + this.w / 2)) + Math.max(0, dy) * 0.6;
                    if (dist < bestScore) {
                        bestScore = dist;
                        targetPlat = p;
                    }
                }
            }
            if (!targetPlat) {
                // 兜底寻找最高安全平台
                for (let p of platforms) {
                    if (!p.broken && (!targetPlat || p.y < targetPlat.y)) targetPlat = p;
                }
            }
            if (targetPlat) {
                const targetX = targetPlat.x + targetPlat.w / 2 - this.w / 2;
                const diffX = targetX - this.x;
                if (Math.abs(diffX) > 3) {
                    aiMoveX = Math.max(-1, Math.min(1, diffX / 18));
                }
                if (this.grounded) {
                    aiJump = true;
                } else if (this.vy > 1.5 && (this.y - targetPlat.y) > 25 && Math.abs(diffX) > 26 && this.dashCool === 0) {
                    this.facing = diffX > 0 ? 1 : -1;
                    aiDash = true;
                }
            }
        }

        if (this.dashTime <= 0) {
            if (autoPlay) {
                this.vx += (aiMoveX * maxSpeed - this.vx) * 0.4;
                if (Math.abs(aiMoveX) > 0.05) this.facing = aiMoveX > 0 ? 1 : -1;
            } else if (Math.abs(analogX) > 0.1) {
                const targetVx = analogX * maxSpeed;
                this.vx += (targetVx - this.vx) * 0.35;
                this.facing = analogX > 0 ? 1 : -1;
            } else if (keys.LEFT) {
                this.vx = Math.max(this.vx - accel, -maxSpeed);
                this.facing = -1;
            } else if (keys.RIGHT) {
                this.vx = Math.min(this.vx + accel, maxSpeed);
                this.facing = 1;
            } else {
                this.vx *= (this.grounded ? 0.78 : 0.9);
                if (Math.abs(this.vx) < 0.05) this.vx = 0;
            }
        }

        const sk = SKINS[shopData.activeSkin] || SKINS.skin_ice;

        // 跳跃 (A键 或 UP键 或 AI跳跃)
        if ((justPressed.A || keys.UP || aiJump) && this.grounded) {
            this.vy = -5.6;
            this.grounded = false;
            this.scaleX = 0.7;
            this.scaleY = 1.35;
            sfx.playJump();
            createParticles(this.x + this.w/2, this.y + this.h, 5, sk.primary, true);
        }

        // 冲刺 (B键 - 非AI模式下 或 AI自动触发)
        if (this.dashCool > 0) this.dashCool--;
        if (((!autoPlay && justPressed.B) || aiDash) && this.dashCool === 0 && this.dashTime <= 0) {
            this.dashTime = 8;
            this.dashCool = 42;
            this.vx = this.facing * 5.6;
            this.vy = -1.2;
            this.scaleX = 1.4;
            this.scaleY = 0.6;
            sfx.playDash();
            createParticles(this.x + this.w/2, this.y + this.h/2, 8, sk.trail, true);
        }

        if (this.dashTime > 0) {
            this.dashTime--;
            particles.push({
                x: this.x + this.w/2, y: this.y + this.h/2,
                vx: 0, vy: 0, r: 5, life: 8, maxLife: 8, color: sk.trail, useCam: true
            });
        } else {
            this.vy += 0.24;
            if (this.vy > 6) this.vy = 6;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x > GW) this.x = -this.w;
        if (this.x + this.w < 0) this.x = GW;

        this.scaleX += (1 - this.scaleX) * 0.2;
        this.scaleY += (1 - this.scaleY) * 0.2;

        this.grounded = false;
        if (this.vy >= 0) {
            for (let p of platforms) {
                if (p.broken) continue;
                if (this.x + this.w > p.x + 2 && 
                    this.x < p.x + p.w - 2 &&
                    this.y + this.h >= p.y && 
                    this.y + this.h <= p.y + p.h + this.vy + 2) {
                    
                    this.y = p.y - this.h;
                    this.vy = 0;
                    this.grounded = true;
                    
                    if(this.scaleY > 1.05) {
                        this.scaleX = 1.25;
                        this.scaleY = 0.75;
                    }
                    if (p.type === 'MOVE') this.x += p.vx;
                    if (p.type === 'BREAK') {
                        p.timer++;
                        if (p.timer > 25) {
                            p.broken = true;
                            createParticles(p.x + p.w/2, p.y, 10, '#bae6fd', true);
                        }
                    }
                    break;
                }
            }
        }
    }

    draw() {
        const sk = SKINS[shopData.activeSkin] || SKINS.skin_ice;
        ctx.save();
        const cx = this.x + this.w / 2;
        const cy = this.y - cameraY + this.h;
        ctx.translate(cx, cy);

        // 护盾光环展示
        if (activeRunPerks.shield) {
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, -this.h / 2, 11, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.scale(this.scaleX, this.scaleY);

        ctx.fillStyle = this.dashCool > 0 && this.dashTime <= 0 ? sk.accent : sk.primary;
        ctx.beginPath();
        ctx.roundRect(-this.w/2, -this.h, this.w, this.h, [6, 6, 3, 3]);
        ctx.fill();

        const eyeOffset = this.facing * 2.5;
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-3 + eyeOffset, -this.h + 5, 2, 3);
        ctx.fillRect(2 + eyeOffset, -this.h + 5, 2, 3);

        ctx.fillStyle = sk.blush;
        ctx.fillRect(-5 + eyeOffset, -this.h + 8, 2, 1.5);
        ctx.fillRect(4 + eyeOffset, -this.h + 8, 2, 1.5);

        ctx.fillStyle = sk.accent;
        ctx.beginPath();
        ctx.arc(0, -this.h - 2, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

function spawnPlatform(y, isFirst = false) {
    const wideBonus = activeRunPerks.wide ? 16 : 0;
    const w = isFirst ? GW - 40 : Math.max(38, 65 - Math.floor(score / 150)) + wideBonus;
    const x = isFirst ? 20 : Math.random() * (GW - w - 10) + 5;
    
    let type = 'NORMAL';
    if (!isFirst && score > 50) {
        const rand = Math.random();
        if (rand < 0.25) type = 'MOVE';
        else if (rand < 0.45) type = 'BREAK';
    }

    platforms.push({
        x, y, w, h: 7,
        type: type,
        vx: type === 'MOVE' ? (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random()*0.5) : 0,
        timer: 0,
        broken: false
    });

    if (!isFirst && Math.random() < 0.48) {
        stars.push({
            x: x + w / 2,
            y: y - 16,
            r: 4,
            collected: false,
            bobOffset: Math.random() * Math.PI * 2
        });
    }
}

function initClimbGame() {
    consumeRunItems();
    player = new ClimbPlayer();
    platforms = [];
    stars = [];
    particles = [];
    cameraY = 0;
    score = 0;

    spawnPlatform(GH - 15, true);
    for (let i = 1; i < 8; i++) {
        spawnPlatform(GH - 15 - i * 32);
    }
}

function updateClimbGame() {
    frameCount++;
    player.update();

    const targetCamY = player.y - GH * 0.55;
    if (targetCamY < cameraY) {
        cameraY += (targetCamY - cameraY) * 0.1;
    }
    if (score > 30) {
        cameraY -= (0.25 + Math.min(0.6, score / 2000));
    }

    const currentHeightScore = Math.floor(Math.abs(Math.min(0, player.y - (GH - 40))) / 5);
    if (currentHeightScore > score) {
        const diff = currentHeightScore - score;
        score = currentHeightScore;
        if (score % 20 === 0) addCoins(1);
    }

    for (let p of platforms) {
        if (p.type === 'MOVE') {
            p.x += p.vx;
            if (p.x < 5 || p.x + p.w > GW - 5) p.vx *= -1;
        }
    }

    platforms = platforms.filter(p => p.y - cameraY < GH + 20);
    while (platforms.length < 8) {
        const highestY = Math.min(...platforms.map(p => p.y));
        spawnPlatform(highestY - (28 + Math.random() * 8));
    }

    for (let s of stars) {
        if (!s.collected) {
            const dx = (player.x + player.w/2) - s.x;
            const dy = (player.y + player.h/2) - s.y;
            if (Math.hypot(dx, dy) < player.w/2 + s.r + 4) {
                s.collected = true;
                score += activeRunPerks.starDouble ? 50 : 25;
                addCoins(5);
                sfx.playCoin();
                createParticles(s.x, s.y, 12, '#fde047', true);
            }
        }
    }
    stars = stars.filter(s => !s.collected && s.y - cameraY < GH + 20);

    updateParticles();

    if (player.y - cameraY > GH + 15) {
        if (activeRunPerks.shield) {
            activeRunPerks.shield = false;
            player.vy = -8.2;
            sfx.playCheat();
            showToast('🛡️ 冰晶护盾已触发! 紧急弹射');
        } else {
            sfx.playDead();
            saveHighScore();
            gameState = 'OVER';
        }
    }
}

function drawClimbGame() {
    drawBackground();
    const sk = SKINS[shopData.activeSkin] || SKINS.skin_ice;

    for (let p of platforms) {
        if (p.broken) continue;
        const py = p.y - cameraY;
        
        if (p.type === 'NORMAL') {
            ctx.fillStyle = sk.accent;
            ctx.beginPath();
            ctx.roundRect(p.x, py, p.w, p.h, 3);
            ctx.fill();
            ctx.fillStyle = sk.primary;
            ctx.beginPath();
            ctx.roundRect(p.x, py, p.w, 3, [3, 3, 0, 0]);
            ctx.fill();
        } else if (p.type === 'MOVE') {
            ctx.fillStyle = '#f472b6';
            ctx.beginPath();
            ctx.roundRect(p.x, py, p.w, p.h, 3);
            ctx.fill();
            ctx.fillStyle = '#fce7f3';
            ctx.fillRect(p.x + 4, py + 1, p.w - 8, 2);
        } else if (p.type === 'BREAK') {
            const shake = p.timer > 0 ? (Math.random() - 0.5) * 2 : 0;
            ctx.fillStyle = p.timer > 12 ? 'rgba(186, 230, 253, 0.4)' : 'rgba(186, 230, 253, 0.75)';
            ctx.beginPath();
            ctx.roundRect(p.x + shake, py, p.w, p.h, 2);
            ctx.fill();
        }
    }

    for (let s of stars) {
        const sy = s.y - cameraY + Math.sin(frameCount * 0.1 + s.bobOffset) * 2.5;
        ctx.save();
        ctx.translate(s.x, sy);
        ctx.rotate(frameCount * 0.04);
        ctx.fillStyle = '#fde047';
        ctx.fillRect(-3.5, -3.5, 7, 7);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-1.5, -1.5, 3, 3);
        ctx.restore();
    }

    drawParticles();
    player.draw();
    drawHUD();
}

/* ================= 游戏 1: GLACIER BREAKER (冰川弹球 + AI托管) ================= */
let paddle;
let balls = [];
let bricks = [];
let drops = [];
let breakerLevel = 1;

function buildBrickGrid(level) {
    bricks = [];
    const cols = 7;
    const rows = Math.min(6, 3 + level);
    const pad = 4;
    const bw = Math.floor((GW - 20 - (cols - 1) * pad) / cols);
    const bh = 10;
    const colors = ['#38bdf8', '#f472b6', '#a78bfa', '#34d399', '#fde047', '#fb7185'];

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const hp = (r === 0 && level > 1) ? 2 : 1;
            bricks.push({
                x: 10 + c * (bw + pad),
                y: 28 + r * (bh + pad),
                w: bw,
                h: bh,
                hp: hp,
                color: colors[(r + level - 1) % colors.length]
            });
        }
    }
}

function initBreakerGame() {
    consumeRunItems();
    score = 0;
    breakerLevel = 1;
    particles = [];
    drops = [];
    const pw = activeRunPerks.wide ? 62 : 44;
    paddle = {
        w: pw,
        h: 7,
        x: GW / 2 - pw / 2,
        y: GH - 18,
        speed: 3.9,
        magnet: false
    };
    balls = [{
        x: GW / 2,
        y: paddle.y - 5,
        vx: 1.8 * (Math.random() > 0.5 ? 1 : -1),
        vy: -2.4,
        r: 4,
        stuck: true
    }];
    buildBrickGrid(breakerLevel);
}

function updateBreakerGame() {
    frameCount++;

    // AI 自动接球与自动发球逻辑
    if (autoPlay) {
        paddle.magnet = true;
        let targetBall = null;
        for (let b of balls) {
            if (b.stuck) {
                b.stuck = false;
                b.vy = -2.7;
                b.vx = (Math.random() - 0.5) * 2.4 || 1.6;
                sfx.playJump();
            }
            if (!targetBall || b.y > targetBall.y) targetBall = b;
        }
        if (targetBall) {
            const targetX = targetBall.x - paddle.w / 2;
            paddle.x += (targetX - paddle.x) * 0.35;
        }
    } else {
        if (Math.abs(analogX) > 0.05) {
            paddle.x += analogX * paddle.speed * 1.15;
        } else if (keys.LEFT) {
            paddle.x -= paddle.speed;
        } else if (keys.RIGHT) {
            paddle.x += paddle.speed;
        }
        paddle.magnet = keys.B;
    }

    paddle.x = Math.max(6, Math.min(GW - paddle.w - 6, paddle.x));

    // A键或UP键发射粘在挡板上的冰球
    if (justPressed.A || keys.UP) {
        for (let b of balls) {
            if (b.stuck) {
                b.stuck = false;
                b.vy = -2.6 - Math.min(1.0, breakerLevel * 0.15);
                b.vx = (Math.random() - 0.5) * 2.4 || 1.5;
                sfx.playJump();
            }
        }
    }

    for (let b of balls) {
        if (b.stuck) {
            b.x = paddle.x + paddle.w / 2;
            b.y = paddle.y - b.r - 1;
            continue;
        }

        b.x += b.vx;
        b.y += b.vy;

        if (b.x - b.r < 4) {
            b.x = 4 + b.r;
            b.vx *= -1;
            sfx.playBounce();
        } else if (b.x + b.r > GW - 4) {
            b.x = GW - 4 - b.r;
            b.vx *= -1;
            sfx.playBounce();
        }
        if (b.y - b.r < 20) {
            b.y = 20 + b.r;
            b.vy *= -1;
            sfx.playBounce();
        }

        if (b.vy > 0 &&
            b.x + b.r >= paddle.x &&
            b.x - b.r <= paddle.x + paddle.w &&
            b.y + b.r >= paddle.y &&
            b.y - b.r <= paddle.y + paddle.h) {
            
            const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
            const speed = Math.min(4.2, Math.hypot(b.vx, b.vy) * 1.02);
            b.vx = hitPos * speed * 0.85;
            b.vy = -Math.sqrt(Math.max(1.5, speed * speed - b.vx * b.vx));
            b.y = paddle.y - b.r - 1;
            sfx.playJump();
            createParticles(b.x, paddle.y, 6, '#38bdf8', false);
        }

        for (let br of bricks) {
            if (br.hp <= 0) continue;
            if (b.x + b.r > br.x && b.x - b.r < br.x + br.w &&
                b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
                
                br.hp--;
                b.vy *= -1;
                score += activeRunPerks.starDouble ? 30 : 15;
                addCoins(2);
                sfx.playBounce();
                createParticles(br.x + br.w / 2, br.y + br.h / 2, 8, br.color, false);

                if (br.hp <= 0 && Math.random() < 0.28) {
                    drops.push({
                        x: br.x + br.w / 2,
                        y: br.y + br.h / 2,
                        type: Math.random() < 0.45 ? 'MULTI' : 'STAR',
                        vy: 1.3
                    });
                }
                break;
            }
        }

        // 护盾反弹底线漏球
        if (b.y + b.r > GH - 4 && activeRunPerks.shield) {
            activeRunPerks.shield = false;
            b.vy = -Math.abs(b.vy);
            sfx.playCheat();
            showToast('🛡️ 冰晶护盾救回冰球!');
        }
    }

    balls = balls.filter(b => b.y - b.r <= GH + 10);
    if (balls.length === 0) {
        sfx.playDead();
        saveHighScore();
        gameState = 'OVER';
        return;
    }

    for (let d of drops) {
        d.y += d.vy;
        if (paddle.magnet) {
            d.x += (paddle.x + paddle.w / 2 - d.x) * 0.08;
            d.y += 0.5;
        }
        if (d.x >= paddle.x - 4 && d.x <= paddle.x + paddle.w + 4 &&
            d.y >= paddle.y - 4 && d.y <= paddle.y + paddle.h + 6) {
            d.collected = true;
            sfx.playCoin();
            if (d.type === 'MULTI' && balls.length < 4) {
                const ref = balls[0];
                balls.push({
                    x: ref.x,
                    y: ref.y,
                    vx: -ref.vx || 1.8,
                    vy: -Math.abs(ref.vy),
                    r: 4,
                    stuck: false
                });
                createParticles(paddle.x + paddle.w/2, paddle.y, 10, '#38bdf8', false);
            } else {
                score += activeRunPerks.starDouble ? 100 : 50;
                addCoins(8);
                createParticles(paddle.x + paddle.w/2, paddle.y, 12, '#fde047', false);
            }
        }
    }
    drops = drops.filter(d => !d.collected && d.y < GH + 10);

    if (bricks.every(br => br.hp <= 0)) {
        breakerLevel++;
        score += 100;
        addCoins(15);
        sfx.playCoin();
        buildBrickGrid(breakerLevel);
        balls = [{
            x: paddle.x + paddle.w / 2,
            y: paddle.y - 5,
            vx: 2.0,
            vy: -2.6,
            r: 4,
            stuck: true
        }];
    }

    updateParticles();
}

function drawBreakerGame() {
    drawBackground();
    const sk = SKINS[shopData.activeSkin] || SKINS.skin_ice;

    if (activeRunPerks.shield) {
        ctx.strokeStyle = 'rgba(52, 211, 153, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GH - 3);
        ctx.lineTo(GW, GH - 3);
        ctx.stroke();
    }

    for (let br of bricks) {
        if (br.hp <= 0) continue;
        ctx.fillStyle = br.color;
        ctx.beginPath();
        ctx.roundRect(br.x, br.y, br.w, br.h, 2.5);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.fillRect(br.x + 2, br.y + 1.5, br.w - 4, 2);

        if (br.hp > 1) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(br.x + 1, br.y + 1, br.w - 2, br.h - 2);
        }
    }

    for (let d of drops) {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.fillStyle = d.type === 'MULTI' ? '#38bdf8' : '#fde047';
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = '6px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText(d.type === 'MULTI' ? '+' : '★', 0, 2.5);
        ctx.restore();
    }

    ctx.fillStyle = paddle.magnet ? '#f472b6' : sk.paddle;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 3.5);
    ctx.fill();
    ctx.fillStyle = sk.primary;
    ctx.fillRect(paddle.x + 4, paddle.y + 1.5, paddle.w - 8, 2);

    for (let b of balls) {
        ctx.fillStyle = sk.primary;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = sk.accent;
        ctx.beginPath();
        ctx.arc(b.x - 1, b.y - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();

        if (b.stuck && Math.floor(frameCount / 20) % 2 === 0) {
            ctx.fillStyle = '#fde047';
            ctx.font = '7px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText('PRESS [A] LAUNCH', GW / 2, GH - 36);
        }
    }

    drawParticles();
    drawHUD();
}

function updateDefenderGame() {
    frameCount++;
    const sk = SKINS[shopData.activeSkin] || SKINS.skin_ice;

    // 秘籍 AI 自动操作：自动瞄准最近陨石敌机 + 紧急规避
    if (autoPlay) {
        let danger = null;
        let target = null;
        for (let e of enemies) {
            if (e.y > fighter.y - 48 && Math.abs(e.x - fighter.x) < 22) {
                danger = e;
            }
            if (!target || e.y > target.y) target = e;
        }
        if (danger) {
            const dir = fighter.x < GW / 2 ? 1 : -1;
            fighter.x += dir * fighter.speed;
        } else if (target) {
            fighter.x += Math.max(-fighter.speed, Math.min(fighter.speed, (target.x - fighter.x) * 0.25));
        }
        fighter.y += ((GH - 30) - fighter.y) * 0.1;
    } else {
        if (Math.abs(analogX) > 0.05 || Math.abs(analogY) > 0.05) {
            fighter.x += analogX * fighter.speed * 1.1;
            fighter.y += analogY * fighter.speed * 1.1;
        } else {
            if (keys.LEFT) fighter.x -= fighter.speed;
            if (keys.RIGHT) fighter.x += fighter.speed;
            if (keys.UP) fighter.y -= fighter.speed;
            if (keys.DOWN) fighter.y += fighter.speed;
        }
    }

    fighter.x = Math.max(14, Math.min(GW - 14, fighter.x));
    fighter.y = Math.max(36, Math.min(GH - 16, fighter.y));

    // 自动连发极光脉冲 + A键加速射击
    if (fighter.fireCool > 0) fighter.fireCool--;
    if ((keys.A || autoPlay || frameCount % 12 === 0) && fighter.fireCool <= 0) {
        fighter.fireCool = 8;
        sfx.playLaser();
        if (activeRunPerks.wide) {
            bullets.push({ x: fighter.x - 6, y: fighter.y - 8, vy: -5.2, color: sk.accent });
            bullets.push({ x: fighter.x + 6, y: fighter.y - 8, vy: -5.2, color: sk.accent });
        } else {
            bullets.push({ x: fighter.x, y: fighter.y - 9, vy: -5.2, color: sk.accent });
        }
    }

    // B键 (非AI时) 释放全屏冰暴清屏技能
    if (fighter.novaCool > 0) fighter.novaCool--;
    if (!autoPlay && justPressed.B && fighter.novaCool <= 0) {
        fighter.novaCool = 150;
        sfx.playDash();
        createParticles(GW / 2, GH / 2, 24, '#38bdf8', false);
        enemies.forEach(e => {
            e.hp -= 2;
            if (e.hp <= 0) {
                score += 20;
                createParticles(e.x, e.y, 8, e.color, false);
            }
        });
    }

    // 刷新冰陨石与外星冰虫
    if (frameCount % Math.max(18, 40 - Math.floor(score / 180)) === 0) {
        const isElite = Math.random() < 0.25;
        enemies.push({
            x: 16 + Math.random() * (GW - 32),
            y: 16,
            r: isElite ? 9 : 6.5,
            hp: isElite ? 3 : 1,
            vy: (isElite ? 0.9 : 1.4) + Math.min(1.2, score / 1000),
            vx: (Math.random() - 0.5) * 0.8,
            color: isElite ? '#f472b6' : '#38bdf8'
        });
    }

    for (let b of bullets) b.y += b.vy;
    bullets = bullets.filter(b => b.y > 16);

    for (let e of enemies) {
        e.x += e.vx;
        e.y += e.vy;
        if (e.x < 12 || e.x > GW - 12) e.vx *= -1;

        // 子弹命中检测
        for (let b of bullets) {
            if (!b.hit && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 3) {
                b.hit = true;
                e.hp--;
                if (e.hp <= 0) {
                    score += activeRunPerks.starDouble ? 40 : 20;
                    addCoins(3);
                    sfx.playBounce();
                    createParticles(e.x, e.y, 10, e.color, false);
                    if (Math.random() < 0.35) {
                        spaceGems.push({ x: e.x, y: e.y, vy: 1.2 });
                    }
                }
                break;
            }
        }

        // 与战机碰撞检测
        if (e.hp > 0 && Math.hypot(e.x - fighter.x, e.y - fighter.y) < e.r + 7) {
            e.hp = 0;
            fighter.hp--;
            sfx.playDead();
            createParticles(fighter.x, fighter.y, 14, '#fb7185', false);
            if (fighter.hp <= 0) {
                saveHighScore();
                gameState = 'OVER';
                return;
            }
        }
    }
    bullets = bullets.filter(b => !b.hit);
    enemies = enemies.filter(e => e.hp > 0 && e.y < GH + 12);

    // 收集掉落星尘宝石
    for (let g of spaceGems) {
        g.y += g.vy;
        if (autoPlay || keys.B) {
            g.x += (fighter.x - g.x) * 0.08;
        }
        if (Math.hypot(g.x - fighter.x, g.y - fighter.y) < 13) {
            g.collected = true;
            score += activeRunPerks.starDouble ? 60 : 30;
            addCoins(6);
            sfx.playCoin();
            createParticles(g.x, g.y, 8, '#fde047', false);
        }
    }
    spaceGems = spaceGems.filter(g => !g.collected && g.y < GH + 10);

    updateParticles();
}

function drawDefenderGame() {
    drawBackground();
    const sk = SKINS[shopData.activeSkin] || SKINS.skin_ice;

    // 绘制星尘宝石
    for (let g of spaceGems) {
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(g.x, g.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // 绘制子弹
    for (let b of bullets) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - 1.5, b.y - 4, 3, 8);
    }

    // 绘制敌方冰陨石
    for (let e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(frameCount * 0.04);
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.roundRect(-e.r, -e.r, e.r * 2, e.r * 2, 3);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-e.r * 0.4, -e.r * 0.4, e.r * 0.8, e.r * 0.8);
        ctx.restore();
    }

    // 绘制极光战机
    ctx.save();
    ctx.translate(fighter.x, fighter.y);
    ctx.fillStyle = sk.primary;
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(10, 8);
    ctx.lineTo(0, 4);
    ctx.lineTo(-10, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = sk.accent;
    ctx.beginPath();
    ctx.arc(0, -1, 3, 0, Math.PI * 2);
    ctx.fill();

    // 尾部推进火焰
    ctx.fillStyle = frameCount % 4 < 2 ? '#fde047' : '#f43f5e';
    ctx.fillRect(-2, 6, 4, 4 + (frameCount % 3));
    ctx.restore();

    drawParticles();
    drawHUD();

    // 绘制战机护盾生命值
    ctx.fillStyle = '#fb7185';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('♥'.repeat(Math.max(0, fighter.hp)), GW / 2, 12);
}

function saveHighScore() {
    if (score > highScores[currentGame]) {
        highScores[currentGame] = score;
        localStorage.setItem(`ice_pocket_hi_${currentGame}`, score);
    }
}

function updateParticles() {
    for (let pt of particles) {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
    }
    particles = particles.filter(pt => pt.life > 0);
}

function drawParticles() {
    for (let pt of particles) {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life / pt.maxLife;
        ctx.beginPath();
        const py = pt.useCam ? pt.y - cameraY : pt.y;
        ctx.arc(pt.x, py, pt.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, GH);
    grad.addColorStop(0, '#09101d');
    grad.addColorStop(1, '#1e293b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, GW, GH);

    ctx.fillStyle = 'rgba(224, 242, 254, 0.35)';
    for (let s of bgSnow) {
        if (gameState === 'PLAY' || systemView === 'HOME') {
            s.y += s.s;
            if (s.y > GH) s.y = 0;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function initActiveGame() {
    if (currentGame === 0) initClimbGame();
    else if (currentGame === 1) initBreakerGame();
    else initDefenderGame();

// 主循环
function loop() {
    if (justPressed.SELECT) {
        sfx.init();
        sfx.toggleMute();
    }
    if (justPressed.GAME) {
        openHomeDesktop();
    }

    if (systemView === 'HOME') {
        updateHomeDesktop();
        drawHomeDesktop();
    } else if (systemView === 'SHOP') {
        updateShopScreen();
        drawShopScreen();
    } else if (systemView === 'GAME') {
        if (gameState === 'TITLE') {
            if (justPressed.B) {
                openHomeDesktop();
            } else if (justPressed.A || justPressed.START) {
                sfx.init();
                sfx.playCoin();
                initActiveGame();
                gameState = 'PLAY';
            }
            drawTitleScreen();
        } else if (gameState === 'PLAY') {
            if (justPressed.START) {
                gameState = 'PAUSE';
                sfx.playCoin();
            } else {
                if (currentGame === 0) updateClimbGame();
                else if (currentGame === 1) updateBreakerGame();
                else updateDefenderGame();

                if (gameState === 'PLAY') drawActiveGameScene();
            }
        } else if (gameState === 'PAUSE') {
            if (justPressed.START || justPressed.A) {
                gameState = 'PLAY';
            }
            drawPause();
        } else if (gameState === 'OVER') {
            if (justPressed.A || justPressed.START) {
                sfx.playJump();
                initActiveGame();
                gameState = 'PLAY';
            } else if (justPressed.B) {
                openHomeDesktop();
            }
            drawGameOver();
        }
    }

    // 全局浮动通知横幅 (秘籍激活/购买提示)
    if (toastTimer > 0) {
        toastTimer--;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(14, GH / 2 - 16, GW - 28, 28, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 10px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(toastMsg, GW / 2, GH / 2 + 2);
    }

    for (let k in justPressed) justPressed[k] = false;
    requestAnimationFrame(loop);
}

/**
 * 3. 十字键秘籍检测 (↑ ↓ ↑ ← → ← →) + 按 B 取消自动操作
 */
function recordDirectionForCheat(dir) {
    cheatBuffer.push(dir);
    if (cheatBuffer.length > CHEAT_SEQUENCE.length) {
        cheatBuffer.shift();
    }
    if (cheatBuffer.length === CHEAT_SEQUENCE.length &&
        cheatBuffer.every((v, i) => v === CHEAT_SEQUENCE[i])) {
        autoPlay = true;
        cheatBuffer = [];
        sfx.init();
        sfx.playCheat();
        updateLedIndicator();
        showToast('✨ 秘籍激活: AI自动托管已开启 (按B取消)', 110);
    }
}

function triggerButton(key, isDown) {
    if (isDown) {
        sfx.init();
        if (!keys[key]) {
            justPressed[key] = true;
            if (navigator.vibrate) navigator.vibrate(10);

            // 记录方向输入以触发 (上下上左右左右) 秘籍
            if (['UP', 'DOWN', 'LEFT', 'RIGHT'].includes(key)) {
                recordDirectionForCheat(key);
            }

            // 按 B 键立即取消 AI 自动操作模式
            if (key === 'B' && autoPlay) {
                autoPlay = false;
                justPressed.B = false; // 避免误触游戏内B键技能或退出
                sfx.playBounce();
                updateLedIndicator();
                showToast('已取消 AI 自动操作模式', 65);
            }
        }
        keys[key] = true;
    } else {
        keys[key] = false;
    }

    const btnEl = document.querySelector(`[data-key="${key}"], [data-dpad="${key}"]`);
    if (btnEl) {
        if (isDown) btnEl.classList.add('active');
        else btnEl.classList.remove('active');
    }
}

// 支持直接触屏点击屏幕上的安卓桌面图标或商店条目
canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const cx = ((e.clientX - rect.left) / rect.width) * GW;
    const cy = ((e.clientY - rect.top) / rect.height) * GH;

    if (systemView === 'HOME') {
        APP_CARDS.forEach((app, idx) => {
            if (cx >= app.x && cx <= app.x + app.w && cy >= app.y && cy <= app.y + app.h) {
                homeCursor = idx;
                launchApp(idx);
            }
        });
    } else if (systemView === 'SHOP') {
        if (cy >= 27 && cy <= 46) {
            shopTab = cx < GW / 2 ? 0 : 1;
            shopCursor = 0;
            sfx.playBounce();
        } else if (cy >= 52 && cy <= 196) {
            const idx = Math.floor((cy - 52) / 36);
            const itemsInTab = SHOP_CATALOG.filter(it => (shopTab === 0 ? it.type === 'skin' : it.type === 'item'));
            if (idx >= 0 && idx < itemsInTab.length) {
                shopCursor = idx;
                triggerButton('A', true);
                setTimeout(() => triggerButton('A', false), 80);
            }
        }
    }
});

// 绑定 AB / START / SELECT / GAME 按钮
document.querySelectorAll('[data-key]').forEach(btn => {
    const key = btn.getAttribute('data-key');
    const handleDown = (e) => {
        e.preventDefault();
        triggerButton(key, true);
    };
    const handleUp = (e) => {
        e.preventDefault();
        triggerButton(key, false);
    };
    btn.addEventListener('pointerdown', handleDown);
    btn.addEventListener('pointerup', handleUp);
    btn.addEventListener('pointerleave', handleUp);
    btn.addEventListener('pointercancel', handleUp);
});

// 灵动跟手摇杆逻辑
const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyTouchId = null;

function handleJoystickMove(clientX, clientY) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const maxDist = rect.width * 0.36;

    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);

    if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
    }

    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;

    analogX = Math.abs(dx) > 5 ? (dx / maxDist) : 0;
    analogY = Math.abs(dy) > 5 ? (dy / maxDist) : 0;

    triggerButton('LEFT', dx < -12);
    triggerButton('RIGHT', dx > 12);
    triggerButton('UP', dy < -14);
    triggerButton('DOWN', dy > 14);
}

function resetJoystick() {
    joyTouchId = null;
    analogX = 0;
    analogY = 0;
    joyKnob.classList.add('returning');
    joyKnob.style.transform = `translate(0px, 0px)`;
    triggerButton('LEFT', false);
    triggerButton('RIGHT', false);
    triggerButton('UP', false);
    triggerButton('DOWN', false);
}

joyZone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.init();
    joyTouchId = e.pointerId;
    joyZone.setPointerCapture(e.pointerId);
    joyKnob.classList.remove('returning');
    handleJoystickMove(e.clientX, e.clientY);
});

joyZone.addEventListener('pointermove', (e) => {
    if (joyTouchId === e.pointerId) {
        e.preventDefault();
        handleJoystickMove(e.clientX, e.clientY);
    }
});

joyZone.addEventListener('pointerup', (e) => {
    if (joyTouchId === e.pointerId) resetJoystick();
});
joyZone.addEventListener('pointercancel', (e) => {
    if (joyTouchId === e.pointerId) resetJoystick();
});

// 经典十字键支持滑动连按与秘籍输入
const dpadZone = document.getElementById('dpad-zone');
let dpadActive = false;

function handleDpadSlide(clientX, clientY) {
    const rect = dpadZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = clientX - cx;
    const dy = clientY - cy;

    if (Math.hypot(dx, dy) < 8) {
        ['UP', 'DOWN', 'LEFT', 'RIGHT'].forEach(k => triggerButton(k, false));
        return;
    }

    // 主方向判定让十字键输入秘籍更精准
    if (Math.abs(dx) > Math.abs(dy)) {
        triggerButton('LEFT', dx < -10);
        triggerButton('RIGHT', dx > 10);
        triggerButton('UP', false);
        triggerButton('DOWN', false);
    } else {
        triggerButton('UP', dy < -10);
        triggerButton('DOWN', dy > 10);
        triggerButton('LEFT', false);
        triggerButton('RIGHT', false);
    }
}

dpadZone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dpadActive = true;
    dpadZone.setPointerCapture(e.pointerId);
    handleDpadSlide(e.clientX, e.clientY);
});
dpadZone.addEventListener('pointermove', (e) => {
    if (dpadActive) {
        e.preventDefault();
        handleDpadSlide(e.clientX, e.clientY);
    }
});
const endDpad = () => {
    dpadActive = false;
    ['UP', 'DOWN', 'LEFT', 'RIGHT'].forEach(k => triggerButton(k, false));
};
dpadZone.addEventListener('pointerup', endDpad);
dpadZone.addEventListener('pointercancel', endDpad);

// 顶部操作模式切换（灵动摇杆 vs 十字键）
let isJoystickMode = true;
document.getElementById('toggle-ergo-btn').addEventListener('click', () => {
    sfx.init();
    sfx.playCoin();
    isJoystickMode = !isJoystickMode;
    const shell = document.getElementById('console-shell');
    const ergoText = document.getElementById('ergo-text');
    const ergoIcon = document.getElementById('ergo-icon');
    const modeTag = document.getElementById('control-mode-tag');

    if (isJoystickMode) {
        joyZone.classList.remove('hidden');
        dpadZone.classList.add('hidden');
        shell.classList.add('ergo-mode');
        ergoIcon.textContent = '🕹️';
        ergoText.textContent = '操作: 灵动摇杆';
        modeTag.textContent = 'JOYSTICK';
    } else {
        joyZone.classList.add('hidden');
        dpadZone.classList.remove('hidden');
        shell.classList.remove('ergo-mode');
        ergoIcon.textContent = '➕';
        ergoText.textContent = '操作: 经典十字键';
        modeTag.textContent = 'D-PAD';
    }
});

// 顶部返回桌面与商店快捷按钮
document.getElementById('switch-game-top').addEventListener('click', () => {
    openHomeDesktop();
});
document.getElementById('open-shop-top').addEventListener('click', () => {
    openShopScreen();
});

// 电脑端键盘事件
const keyMap = {
    'ArrowUp': 'UP', 'KeyW': 'UP',
    'ArrowDown': 'DOWN', 'KeyS': 'DOWN',
    'ArrowLeft': 'LEFT', 'KeyA': 'LEFT',
    'ArrowRight': 'RIGHT', 'KeyD': 'RIGHT',
    'KeyJ': 'A', 'KeyZ': 'A', 'Space': 'A',
    'KeyK': 'B', 'KeyX': 'B', 'ShiftLeft': 'B', 'ShiftRight': 'B',
    'Enter': 'START',
    'KeyM': 'SELECT',
    'KeyG': 'GAME', 'Tab': 'GAME'
};

window.addEventListener('keydown', (e) => {
    const mapped = keyMap[e.code];
    if (mapped) {
        e.preventDefault();
        triggerButton(mapped, true);
    }
});

window.addEventListener('keyup', (e) => {
    const mapped = keyMap[e.code];
    if (mapped) {
        e.preventDefault();
        triggerButton(mapped, false);
    }
});

// 启动 ICE OS 游戏机
requestAnimationFrame(loop);

</script>
</body></html>
