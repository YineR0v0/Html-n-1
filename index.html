            user-select: none;
            -webkit-user-select: none;

        }

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.25) 100%);

            backdrop-filter: blur(4px);
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-jelly-cyan:active, .btn-jelly-cyan.active {
            transform: translateY(5px);

                0 1px 0 rgba(3, 105, 161, 0.6),

        /* 功能小胶囊键 */
        .pill-btn {
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 3px 0 rgba(148, 163, 184, 0.5), 0 4px 6px rgba(0,0,0,0.05), inset 0 1px 2px white;

        /* 装饰背景气泡 */

        /* 扫描线效果 */

            background: linear-gradient(

                rgba(0, 0, 0, 0.15)

            background-size: 100% 4px;

<script src="https://cdn.tailwindcss.com"></script>

    <!-- 电脑端操作提示 -->

<script>

/**
         * 1. 音效合成器 (Web Audio API 8-bit 冰晶音效)
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            toggleMute() {
                this.muted = !this.muted;
                const led = document.getElementById('power-led');
                if(this.muted) {
                    led.className = "w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]";
                } else {
                    led.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]";
                    this.playCoin();
                }
            }
            playJump() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
            playDash() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playCoin() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.07); // E6
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.35);
            }
            playDead() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.4);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.4);
            }
        }

        const sfx = new SoundFX();

        /**
         * 2. 游戏引擎与逻辑：《冰晶企鹅大冒险》(Frosty Climb)
         * 玩法：控制可爱的圆润小冰灵不断向上跳跃，B键冲刺，收集星星，脚下的深渊会不断上升！
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 固定内部渲染分辨率，保持像素/复古精致感
        const GW = 240;
        const GH = 200;
        canvas.width = GW;
        canvas.height = GH;

        // 输入状态管理
        const keys = { UP: false, DOWN: false, LEFT: false, RIGHT: false, A: false, B: false };
        const justPressed = { A: false, B: false, START: false, SELECT: false };

        // 游戏全局变量
        let gameState = 'TITLE'; // TITLE, PLAY, PAUSE, OVER
        let score = 0;
        let highScore = localStorage.getItem('ice_pocket_hi') || 0;
        let cameraY = 0;
        let frameCount = 0;

        // 实体对象
        let player;
        let platforms = [];
        let stars = [];
        let particles = [];
        let bgSnow = [];

        // 初始化背景雪花
        for(let i=0; i<25; i++) {
            bgSnow.push({
                x: Math.random() * GW,
                y: Math.random() * GH,
                r: Math.random() * 1.5 + 0.5,
                s: Math.random() * 0.5 + 0.2
            });
        }

        class Player {
            constructor() {
                this.w = 14;
                this.h = 14;
                this.x = GW / 2 - this.w / 2;
                this.y = GH - 40;
                this.vx = 0;
                this.vy = 0;
                this.grounded = false;
                this.dashCool = 0;
                this.dashTime = 0;
                this.facing = 1; // 1 right, -1 left
                // 动画形变参数 (挤压与拉伸)
                this.scaleX = 1;
                this.scaleY = 1;
            }

            update() {
                // 左右移动
                const accel = this.grounded ? 0.5 : 0.3;
                const maxSpeed = 2.6;
                
                if (this.dashTime <= 0) {
                    if (keys.LEFT) {
                        this.vx = Math.max(this.vx - accel, -maxSpeed);
                        this.facing = -1;
                    } else if (keys.RIGHT) {
                        this.vx = Math.min(this.vx + accel, maxSpeed);
                        this.facing = 1;
                    } else {
                        this.vx *= (this.grounded ? 0.8 : 0.92);
                        if (Math.abs(this.vx) < 0.05) this.vx = 0;
                    }
                }

                // 跳跃 (A键 或 UP键)
                if ((justPressed.A || keys.UP) && this.grounded) {
                    this.vy = -5.4;
                    this.grounded = false;
                    this.scaleX = 0.7;
                    this.scaleY = 1.35;
                    sfx.playJump();
                    createParticles(this.x + this.w/2, this.y + this.h, 5, '#e0f2fe');
                }

                // 冲刺 (B键) - 炫酷位移
                if (this.dashCool > 0) this.dashCool--;
                if (justPressed.B && this.dashCool === 0 && this.dashTime <= 0) {
                    this.dashTime = 8;
                    this.dashCool = 45;
                    this.vx = this.facing * 5.5;
                    this.vy = -1.2; // 略微浮空
                    this.scaleX = 1.4;
                    this.scaleY = 0.6;
                    sfx.playDash();
                    createParticles(this.x + this.w/2, this.y + this.h/2, 8, '#38bdf8');
                }

                if (this.dashTime > 0) {
                    this.dashTime--;
                    // 冲刺残影粒子
                    particles.push({
                        x: this.x + this.w/2, y: this.y + this.h/2,
                        vx: 0, vy: 0, r: 5, life: 8, maxLife: 8, color: 'rgba(56, 189, 248, 0.5)'
                    });
                } else {
                    // 重力
                    this.vy += 0.24;
                    if (this.vy > 6) this.vy = 6;
                }

                // 应用速度
                this.x += this.vx;
                this.y += this.vy;

                // 屏幕左右穿墙 (吃豆人式循环)
                if (this.x > GW) this.x = -this.w;
                if (this.x + this.w < 0) this.x = GW;

                // 恢复形变
                this.scaleX += (1 - this.scaleX) * 0.2;
                this.scaleY += (1 - this.scaleY) * 0.2;

                // 平台碰撞检测 (仅在下落时检测)
                this.grounded = false;
                if (this.vy >= 0) {
                    for (let p of platforms) {
                        if (p.broken) continue;
                        if (this.x + this.w > p.x + 2 && 
                            this.x < p.x + p.w - 2 &&
                            this.y + this.h >= p.y && 
                            this.y + this.h <= p.y + p.h + this.vy + 2) {
                            
                            this.y = p.y - this.h;
                            this.vy = 0;
                            this.grounded = true;
                            
                            // 落地挤压动画
                            if(this.scaleY > 1.05) {
                                this.scaleX = 1.25;
                                this.scaleY = 0.75;
                            }

                            // 跟随移动平台
                            if (p.type === 'MOVE') {
                                this.x += p.vx;
                            }
                            // 碎冰平台触发
                            if (p.type === 'BREAK') {
                                p.timer++;
                                if (p.timer > 25) {
                                    p.broken = true;
                                    createParticles(p.x + p.w/2, p.y, 10, '#bae6fd');
                                }
                            }
                            break;
                        }
                    }
                }
            }

            draw() {
                ctx.save();
                const cx = this.x + this.w / 2;
                const cy = this.y - cameraY + this.h; // 以底部为中心缩放
                ctx.translate(cx, cy);
                ctx.scale(this.scaleX, this.scaleY);

                // 绘制可爱冰精灵身体 (圆角矩形)
                ctx.fillStyle = this.dashCool > 0 && this.dashTime <= 0 ? '#bae6fd' : '#ffffff';
                ctx.beginPath();
                ctx.roundRect(-this.w/2, -this.h, this.w, this.h, [6, 6, 3, 3]);
                ctx.fill();

                // 冰精灵内部腮红与眼睛
                const eyeOffset = this.facing * 2.5;
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(-3 + eyeOffset, -this.h + 5, 2, 3);
                ctx.fillRect(2 + eyeOffset, -this.h + 5, 2, 3);

                // 粉色腮红
                ctx.fillStyle = '#fb7185';
                ctx.fillRect(-5 + eyeOffset, -this.h + 8, 2, 1.5);
                ctx.fillRect(4 + eyeOffset, -this.h + 8, 2, 1.5);

                // 头顶小冰晶呆毛
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(0, -this.h - 2, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3 - 1,
                    r: Math.random() * 2 + 1,
                    life: 15 + Math.random() * 10,
                    maxLife: 25,
                    color: color
                });
            }
        }

        function spawnPlatform(y, isFirst = false) {
            const w = isFirst ? GW - 40 : Math.max(36, 65 - Math.floor(score / 150));
            const x = isFirst ? 20 : Math.random() * (GW - w - 10) + 5;
            
            let type = 'NORMAL';
            if (!isFirst && score > 50) {
                const rand = Math.random();
                if (rand < 0.25) type = 'MOVE';
                else if (rand < 0.45) type = 'BREAK';
            }

            platforms.push({
                x, y, w, h: 7,
                type: type,
                vx: type === 'MOVE' ? (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random()*0.5) : 0,
                timer: 0,
                broken: false
            });

            // 伴随生成收集物 (冰晶星星)
            if (!isFirst && Math.random() < 0.45) {
                stars.push({
                    x: x + w / 2,
                    y: y - 16,
                    r: 4,
                    collected: false,
                    bobOffset: Math.random() * Math.PI * 2
                });
            }
        }

        function initGame() {
            player = new Player();
            platforms = [];
            stars = [];
            particles = [];
            cameraY = 0;
            score = 0;

            // 生成初始平台
            spawnPlatform(GH - 15, true);
            for (let i = 1; i < 7; i++) {
                spawnPlatform(GH - 15 - i * 32);
            }
        }

        function updateGame() {
            frameCount++;
            player.update();

            // 相机向上平滑跟随玩家
            const targetCamY = player.y - GH * 0.55;
            if (targetCamY < cameraY) {
                cameraY += (targetCamY - cameraY) * 0.1;
            }
            
            // 随着时间推移相机也会自动缓慢上升（深渊逼近感）
            if (score > 30) {
                cameraY -= (0.25 + Math.min(0.6, score / 2000));
            }

            // 更新高度得分
            const currentHeightScore = Math.floor(Math.abs(Math.min(0, player.y - (GH - 40))) / 5);
            if (currentHeightScore > score) {
                score = currentHeightScore;
            }

            // 更新平台与生成新平台
            for (let p of platforms) {
                if (p.type === 'MOVE') {
                    p.x += p.vx;
                    if (p.x < 5 || p.x + p.w > GW - 5) p.vx *= -1;
                }
            }

            // 移除屏幕下方的平台并生成上方新平台
            platforms = platforms.filter(p => p.y - cameraY < GH + 20);
            while (platforms.length < 7) {
                const highestY = Math.min(...platforms.map(p => p.y));
                spawnPlatform(highestY - (28 + Math.random() * 8));
            }

            // 星星收集检测
            for (let s of stars) {
                if (!s.collected) {
                    const dx = (player.x + player.w/2) - s.x;
                    const dy = (player.y + player.h/2) - s.y;
                    if (Math.hypot(dx, dy) < player.w/2 + s.r + 3) {
                        s.collected = true;
                        score += 25;
                        sfx.playCoin();
                        createParticles(s.x, s.y, 12, '#fde047');
                    }
                }
            }
            stars = stars.filter(s => !s.collected && s.y - cameraY < GH + 20);

            // 更新粒子
            for (let pt of particles) {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
            }
            particles = particles.filter(pt => pt.life > 0);

            // 死亡判定 (掉落屏幕底部)
            if (player.y - cameraY > GH + 15) {
                sfx.playDead();
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('ice_pocket_hi', highScore);
                }
                gameState = 'OVER';
            }
        }

        function drawBackground() {
            // 深邃冰海渐变背景
            const grad = ctx.createLinearGradient(0, 0, 0, GH);
            grad.addColorStop(0, '#09101d');
            grad.addColorStop(1, '#1e293b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, GW, GH);

            // 飘落雪花
            ctx.fillStyle = 'rgba(224, 242, 254, 0.35)';
            for (let s of bgSnow) {
                if (gameState === 'PLAY') {
                    s.y += s.s;
                    if (s.y > GH) s.y = 0;
                }
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGame() {
            drawBackground();

            // 绘制平台
            for (let p of platforms) {
                if (p.broken) continue;
                const py = p.y - cameraY;
                
                if (p.type === 'NORMAL') {
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.roundRect(p.x, py, p.w, p.h, 3);
                    ctx.fill();
                    // 顶部积雪高光
                    ctx.fillStyle = '#e0f2fe';
                    ctx.beginPath();
                    ctx.roundRect(p.x, py, p.w, 3, [3, 3, 0, 0]);
                    ctx.fill();
                } else if (p.type === 'MOVE') {
                    ctx.fillStyle = '#f472b6'; // 粉色移动冰砖
                    ctx.beginPath();
                    ctx.roundRect(p.x, py, p.w, p.h, 3);
                    ctx.fill();
                    ctx.fillStyle = '#fce7f3';
                    ctx.fillRect(p.x + 4, py + 1, p.w - 8, 2);
                } else if (p.type === 'BREAK') {
                    // 闪烁的碎冰
                    const shake = p.timer > 0 ? (Math.random() - 0.5) * 2 : 0;
                    ctx.fillStyle = p.timer > 12 ? 'rgba(186, 230, 253, 0.4)' : 'rgba(186, 230, 253, 0.75)';
                    ctx.beginPath();
                    ctx.roundRect(p.x + shake, py, p.w, p.h, 2);
                    ctx.fill();
                }
            }

            // 绘制收集星星 (冰晶菱形)
            for (let s of stars) {
                const sy = s.y - cameraY + Math.sin(frameCount * 0.1 + s.bobOffset) * 2.5;
                ctx.save();
                ctx.translate(s.x, sy);
                ctx.rotate(frameCount * 0.04);
                ctx.fillStyle = '#fde047';
                ctx.fillRect(-3.5, -3.5, 7, 7);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-1.5, -1.5, 3, 3);
                ctx.restore();
            }

            // 绘制粒子
            for (let pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / pt.maxLife;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y - cameraY, pt.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 绘制玩家
            player.draw();

            // 顶部 HUD 分数栏
            ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
            ctx.fillRect(0, 0, GW, 18);
            ctx.fillStyle = '#38bdf8';
            ctx.font = '8px "Press Start 2P"';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE:${score}`, 6, 12);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText(`HI:${highScore}`, GW - 6, 12);
        }

        function drawTitleScreen() {
            drawBackground();
            frameCount++;

            // 标题框
            ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(25, 30, GW - 50, 68, 8);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = '#e0f2fe';
            ctx.font = '14px "Press Start 2P"';
            ctx.fillText('FROSTY', GW / 2, 56);
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('CLIMB', GW / 2, 78);

            // 展示小冰灵动画
            const bounceY = Math.abs(Math.sin(frameCount * 0.08)) * 12;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(GW/2 - 8, 125 - bounceY, 16, 16, [7, 7, 3, 3]);
            ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(GW/2 - 3, 130 - bounceY, 2, 3);
            ctx.fillRect(GW/2 + 3, 130 - bounceY, 2, 3);

            // 闪烁提示
            if (Math.floor(frameCount / 25) % 2 === 0) {
                ctx.fillStyle = '#fde047';
                ctx.font = '8px "Press Start 2P"';
                ctx.fillText('PRESS [A] OR START', GW / 2, 168);
            }

            ctx.fillStyle = '#64748b';
            ctx.font = '7px "Press Start 2P"';
            ctx.fillText('[A] JUMP   [B] DASH', GW / 2, 186);
        }

        function drawGameOver() {
            drawGame();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.fillRect(0, 0, GW, GH);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#fb7185';
            ctx.font = '14px "Press Start 2P"';
            ctx.fillText('GAME OVER', GW / 2, 75);

            ctx.fillStyle = '#e0f2fe';
            ctx.font = '9px "Press Start 2P"';
            ctx.fillText(`SCORE: ${score}`, GW / 2, 105);
            
            ctx.fillStyle = '#fde047';
            ctx.fillText(`BEST:  ${highScore}`, GW / 2, 125);

            if (Math.floor(++frameCount / 25) % 2 === 0) {
                ctx.fillStyle = '#38bdf8';
                ctx.font = '8px "Press Start 2P"';
                ctx.fillText('PRESS [A] TO RETRY', GW / 2, 160);
            }
        }

        function drawPause() {
            drawGame();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
            ctx.fillRect(0, 0, GW, GH);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#e0f2fe';
            ctx.font = '12px "Press Start 2P"';
            ctx.fillText('PAUSED', GW / 2, GH / 2 + 4);
        }

        // 主循环
        function loop() {
            // 处理状态切换指令
            if (justPressed.SELECT) {
                sfx.init();
                sfx.toggleMute();
            }

            if (gameState === 'TITLE') {
                if (justPressed.A || justPressed.START) {
                    sfx.init();
                    sfx.playCoin();
                    initGame();
                    gameState = 'PLAY';
                }
                drawTitleScreen();
            } else if (gameState === 'PLAY') {
                if (justPressed.START) {
                    gameState = 'PAUSE';
                    sfx.playCoin();
                } else {
                    updateGame();
                    drawGame();
                }
            } else if (gameState === 'PAUSE') {
                if (justPressed.START || justPressed.A) {
                    gameState = 'PLAY';
                }
                drawPause();
            } else if (gameState === 'OVER') {
                if (justPressed.A || justPressed.START) {
                    sfx.playJump();
                    initGame();
                    gameState = 'PLAY';
                }
                drawGameOver();
            }

            // 重置单次触发按键
            for (let k in justPressed) justPressed[k] = false;

            requestAnimationFrame(loop);
        }

        /**
         * 3. 硬件按钮与键盘交互绑定 (完美兼容移动端多点触控与桌面端)
         */
        function triggerButton(key, isDown) {
            if (isDown) {
                sfx.init();
                if (!keys[key]) {
                    justPressed[key] = true;
                    // 移动端轻微震动反馈
                    if (navigator.vibrate) navigator.vibrate(12);
                }
                keys[key] = true;
            } else {
                keys[key] = false;
            }

            // 更新UI按钮按下样式
            const btnEl = document.querySelector(`[data-key="${key}"]`);
            if (btnEl) {
                if (isDown) btnEl.classList.add('active');
                else btnEl.classList.remove('active');
            }
        }

        // 绑定虚拟按键触摸与鼠标事件
        document.querySelectorAll('[data-key]').forEach(btn => {
            const key = btn.getAttribute('data-key');
            
            const handleDown = (e) => {
                e.preventDefault();
                triggerButton(key, true);
            };
            const handleUp = (e) => {
                e.preventDefault();
                triggerButton(key, false);
            };

            btn.addEventListener('pointerdown', handleDown);
            btn.addEventListener('pointerup', handleUp);
            btn.addEventListener('pointerleave', handleUp);
            btn.addEventListener('pointercancel', handleUp);
        });

        // 绑定电脑端键盘事件
        const keyMap = {
            'ArrowUp': 'UP', 'KeyW': 'UP',
            'ArrowDown': 'DOWN', 'KeyS': 'DOWN',
            'ArrowLeft': 'LEFT', 'KeyA': 'LEFT',
            'ArrowRight': 'RIGHT', 'KeyD': 'RIGHT',
            'KeyJ': 'A', 'KeyZ': 'A', 'Space': 'A',
            'KeyK': 'B', 'KeyX': 'B', 'ShiftLeft': 'B', 'ShiftRight': 'B',
            'Enter': 'START',
            'KeyM': 'SELECT'
        };

        window.addEventListener('keydown', (e) => {
            const mapped = keyMap[e.code];
            if (mapped) {
                e.preventDefault();
                triggerButton(mapped, true);
            }
        });

        window.addEventListener('keyup', (e) => {
            const mapped = keyMap[e.code];
            if (mapped) {
                e.preventDefault();
                triggerButton(mapped, false);
            }
        });

        // 启动游戏机
        requestAnimationFrame(loop);

</script>
</body></html>
